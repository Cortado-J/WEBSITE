<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Justin Roughley</title>
<meta name="description" content="Justin Roughley: Celtic knots, wallpaper patterns and mathematics.">
<style>
  :root{
    --bg:#F6EFE3; --ink:#1B2428; --muted:#566063; --knot:#D6A26C; --link:#1F6FAE;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1B2428; --ink:#F1E8D8; --muted:#A9B2B4; --link:#7FB8E6; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font:400 clamp(18px,2.4vw,21px)/1.6 Georgia,"Times New Roman",serif;
    border-top:10px solid var(--knot);
  }
  main{max-width:36rem; margin:0 auto; padding:14vh 16px 8vh}
  h1{font-weight:400; font-size:clamp(2rem,6vw,2.75rem); line-height:1.15; margin:0 0 .5rem}
  .tag{margin:0 0 2.5rem; color:var(--muted)}
  ul{list-style:none; margin:0; padding:0}
  li{margin:0 0 1.1rem}
  li span{display:block; color:var(--muted); font-size:.85em}
  a{color:var(--link); text-underline-offset:.2em}
  a:hover,a:focus-visible{text-decoration-thickness:2px}
</style>
</head>
<body>
<main>
  <h1>Justin Roughley</h1>
  <p class="tag">Celtic knots, wallpaper patterns and mathematics.</p>
  <ul>
    <li><a href="https://www.instagram.com/17_patterns/">Instagram</a>
      <span>@17_patterns</span></li>
    <li><a href="https://www.fawnsandloom.co.uk">Fawns &amp; Loom</a>
      <span>fawnsandloom.co.uk</span></li>
    <li><a href="https://www.equatum.com">Equatum</a>
      <span>equatum.com</span></li>
  </ul>
</main>
</body>
</html>
